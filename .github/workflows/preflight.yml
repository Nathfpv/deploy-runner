name: Validate public relay deployment configuration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c9fc92304d53c544852ae134d04aefe9
    steps:
      - name: Validate relay-only Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          verify_code="$(curl --max-time 15 -sS -o /tmp/cf-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$verify_code" = "200" || { echo "::error::Cloudflare relay credential invalid (HTTP $verify_code)"; exit 1; }
          workers_code="$(curl --max-time 15 -sS -o /tmp/cf-workers.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          test "$workers_code" = "200" || { echo "::error::Workers access denied (HTTP $workers_code)"; exit 1; }
          python3 - <<'PY'
          import json
          for path in ("/tmp/cf-verify.json", "/tmp/cf-workers.json"):
              with open(path, encoding="utf-8") as f:
                  if not json.load(f).get("success"):
                      raise SystemExit("Cloudflare API reported failure")
          print("Public relay Cloudflare credential valid.")
          PY
