name: Validate public deploy runner secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secret presence
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          HOSTSTAR_FTP_PASSWORD: ${{ secrets.HOSTSTAR_FTP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          failed=0
          for name in SOURCE_REPO_TOKEN HOSTSTAR_FTP_PASSWORD CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is missing."
              failed=1
            else
              echo "$name is configured."
            fi
          done
          exit "$failed"

      - name: Verify source token can read private controller
        if: success()
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Nathfpv/deploy-infra/contents/README.md)"
          test "$code" = "200" || { echo "::error::SOURCE_REPO_TOKEN cannot read private deploy-infra (HTTP $code)."; exit 1; }
          echo "Private controller access verified."

      - name: Verify Cloudflare token and Workers access
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c9fc92304d53c544852ae134d04aefe9
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN is missing."; exit 1; }

          verify_code="$(curl -sS -o /tmp/cf-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$verify_code" = "200" || { echo "::error::Cloudflare token verification failed (HTTP $verify_code)."; exit 1; }

          workers_code="$(curl -sS -o /tmp/cf-workers.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          test "$workers_code" = "200" || { echo "::error::Cloudflare token cannot access Workers for configured account (HTTP $workers_code)."; exit 1; }

          python3 - <<'PY'
          import json
          for path in ("/tmp/cf-verify.json", "/tmp/cf-workers.json"):
              data = json.load(open(path))
              if not data.get("success"):
                  raise SystemExit("Cloudflare API reported failure")
          print("Cloudflare token is valid and can access Workers.")
          PY
