name: Validate public deploy runner secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secret presence
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          HOSTSTAR_FTP_PASSWORD: ${{ secrets.HOSTSTAR_FTP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          failed=0
          for name in SOURCE_REPO_TOKEN HOSTSTAR_FTP_PASSWORD CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is missing."
              failed=1
            else
              echo "$name is configured."
            fi
          done
          exit "$failed"

      - name: Verify source token can read private controller
        if: success()
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}'             -H "Authorization: Bearer $SOURCE_REPO_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/Nathfpv/deploy-infra/contents/README.md)"
          test "$code" = "200" || { echo "::error::SOURCE_REPO_TOKEN cannot read private deploy-infra (HTTP $code)."; exit 1; }
          echo "Private controller access verified."

      - name: Verify Cloudflare token validity
        if: success()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/cf.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$code" = "200" || { echo "::error::CLOUDFLARE_API_TOKEN verification failed (HTTP $code)."; exit 1; }
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/cf.json'))
          if not data.get('success'):
              raise SystemExit('Cloudflare token verification failed')
          print('Cloudflare token is valid.')
          PY
