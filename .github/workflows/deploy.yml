# Private-source builds in public GitHub-hosted Actions are intentionally disabled.
# The previous design used public jobs to execute private software builds and then
# exposed deployment credentials later in the same job. Deleting the workspace was
# not a sufficient security boundary. GitHub's Additional Products Terms also
# require hosted work to be related to this public repository's own software.
#
# Production publishing remains functional in private Nathfpv/deploy-infra.
# This public repository may publish its own Cloudflare OIDC relay via the
# independently scoped deploy-cloudflare-relay.yml workflow.
name: Disabled legacy public private-source deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse private source builds and deploys
        run: |
          echo "::error::Public private-source deployments are disabled for policy and credential isolation. Use the private Nathfpv/deploy-infra controller."
          exit 1
