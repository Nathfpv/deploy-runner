name: Cloudflare secret bridge probe

on:
  workflow_call:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify caller context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Nathfpv/local-ai" || {
            echo "::error::Unexpected caller repository: $GITHUB_REPOSITORY"
            exit 1
          }
          echo "Caller repository is $GITHUB_REPOSITORY at $GITHUB_SHA."

      - name: Check deploy-runner Cloudflare secret visibility
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::CLOUDFLARE_API_TOKEN is not visible in reusable-workflow context."
            exit 1
          }
          code="$(curl -sS -o /tmp/cf.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             https://api.cloudflare.com/client/v4/user/tokens/verify)"
          test "$code" = "200" || { echo "::error::Cloudflare verification failed HTTP $code"; exit 1; }
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/cf.json"))
          if not data.get("success"):
              raise SystemExit("Cloudflare API reported failure")
          print("Reusable workflow can access a valid Cloudflare token.")
          PY
