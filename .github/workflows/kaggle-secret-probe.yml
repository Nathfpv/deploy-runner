name: Kaggle secret presence probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaggle-secret-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report presence only
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN:-}" ]] && echo "KAGGLE_API_TOKEN_PRESENT=true" || echo "KAGGLE_API_TOKEN_PRESENT=false"
          [[ -n "${KAGGLE_USERNAME:-}" ]] && echo "KAGGLE_USERNAME_PRESENT=true" || echo "KAGGLE_USERNAME_PRESENT=false"
          [[ -n "${KAGGLE_KEY:-}" ]] && echo "KAGGLE_KEY_PRESENT=true" || echo "KAGGLE_KEY_PRESENT=false"
