name: Probe Cloudflare native Git builds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-builds-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c9fc92304d53c544852ae134d04aefe9
      GITHUB_ACCOUNT_ID: "295855229"
      GITHUB_REPO_ID: "1378482690"
    steps:
      - name: Verify token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             https://api.cloudflare.com/client/v4/user/tokens/verify >/tmp/token.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/token.json"))
          assert d.get("success"), d
          print("Cloudflare token valid.")
          PY

      - name: Inspect workers and builds API
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          curl -fsS "${auth[@]}"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"             >/tmp/workers.json

          for endpoint in builds/tokens builds/repos/connections; do
            code="$(curl -sS -o "/tmp/${endpoint//\//-}.json" -w '%{http_code}'               "${auth[@]}"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$endpoint")"
            echo "$endpoint HTTP $code"
          done

          python3 - <<'PY'
          import json
          workers=json.load(open("/tmp/workers.json")).get("result",[])
          wanted={"local-ai-edge","local-ai-user-admin"}
          print("Workers:")
          for w in workers:
              if w.get("id") in wanted:
                  print(f"- {w.get('id')} tag={w.get('tag')}")
          for p in ("/tmp/builds-tokens.json","/tmp/builds-repos-connections.json"):
              try:
                  d=json.load(open(p))
              except Exception:
                  continue
              print(p, "success=", d.get("success"), "result_type=", type(d.get("result")).__name__)
              if isinstance(d.get("result"), list):
                  print("count=", len(d["result"]))
          PY

      - name: Ensure Cloudflare repository connection exists
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json
          print(json.dumps({
            "provider_type":"github",
            "provider_account_id":"295855229",
            "provider_account_name":"Nathfpv",
            "repo_id":"1378482690",
            "repo_name":"local-ai",
          }))
          PY
          )"
          code="$(curl -sS -o /tmp/connection.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --request PUT             --data "$payload"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/repos/connections")"
          echo "repo connection HTTP $code"
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/connection.json"))
          print("success=", d.get("success"))
          if d.get("success"):
              r=d.get("result") or {}
              print("repo_connection_uuid=", r.get("repo_connection_uuid") or r.get("uuid") or r.get("id"))
              print("repo_name=", r.get("repo_name"))
          else:
              print("errors=", d.get("errors"))
          PY
          test "$code" -ge 200 -a "$code" -lt 300
